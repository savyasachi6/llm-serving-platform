# Docker Compose file for the Agentic LLM Serving Platform.
# This orchestrates all services for local development.
#
# Usage:
#   Local (CPU/Ollama):  docker compose -f infra/compose/docker-compose.yml --profile local up -d --build
#   GPU (vLLM):          docker compose -f infra/compose/docker-compose.yml --profile gpu up -d --build
version: '3.8'

services:
  # --- Application Services ---

  # The API Gateway: ingress, admission control, caching, routing.
  gateway:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      # In Docker Compose, services communicate via their service names.
      # 'vllm' and 'ollama' resolve to the respective containers below.
      - VLLM_BASE_URL=http://vllm:8080/v1
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
    networks:
      - llm_net

  # The Agent Worker: multi-agent orchestration (Triage, Redact, Respond).
  agent-worker:
    build:
      context: ../../
      dockerfile: apps/agent-worker/Dockerfile
    ports:
      - "8001:8001"
    environment:
      # Points to the gateway service above via Docker Compose DNS.
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - llm_net

  # The Playground: React/Vite frontend UI served via Nginx.
  playground:
    build:
      context: ../../apps/playground
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway
      - agent-worker
    networks:
      - llm_net

  # --- Inference Engines ---

  # vLLM: High-performance GPU inference engine (only started with --profile gpu).
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8080:8080"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model meta-llama/Meta-Llama-3-8B-Instruct
      --gpu-memory-utilization 0.85
      --enable-prefix-caching
      --max-model-len 4096
      --port 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - llm_net

  # Ollama: Local CPU inference fallback (only started with --profile local).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local
    networks:
      - llm_net

  # --- Infrastructure ---

  # Redis: Used for caching and session state.
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - llm_net

  # Qdrant: Vector database for RAG retrieval.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles:
      - local
      - gpu
    networks:
      - llm_net

  # Prometheus: Metrics collection and monitoring.
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - local
      - gpu
    networks:
      - llm_net

volumes:
  ollama_data:
  qdrant_data:

networks:
  llm_net:
