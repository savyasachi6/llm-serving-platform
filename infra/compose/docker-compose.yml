# Docker Compose file for the Agentic LLM Serving Platform.
# This orchestrates all services for local development.
#
# Usage:
#   Local (CPU/Ollama):  docker compose -f infra/compose/docker-compose.yml --profile local up -d --build
#   GPU (vLLM):          docker compose -f infra/compose/docker-compose.yml --profile gpu up -d --build
version: '3.8'

services:
  # --- Application Services ---

  # The API Gateway: ingress, admission control, caching, routing.
  gateway:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      # In Docker Compose, services communicate via their service names.
      - VLLM_PRECISION_BASE_URL=http://vllm-precision:8080/v1
      - VLLM_THROUGHPUT_BASE_URL=http://vllm-throughput:8080/v1
      - VLLM_BASE_URL=http://vllm-precision:8080/v1
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
    networks:
      - llm_net

  # The Agent Worker: multi-agent orchestration (Triage, Redact, Respond).
  agent-worker:
    build:
      context: ../../
      dockerfile: apps/agent-worker/Dockerfile
    ports:
      - "8001:8001"
    environment:
      # Points to the gateway service above via Docker Compose DNS.
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - llm_net

  # The Playground: React/Vite frontend UI served via Nginx.
  playground:
    build:
      context: ../../apps/playground
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway
      - agent-worker
    networks:
      - llm_net

  # --- Inference Engines ---

  # vLLM Precision: Dedicated high-accuracy reasoning & synthesis node.
  vllm-precision:
    image: vllm/vllm-openai:latest
    ports:
      - "8080:8080"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model meta-llama/Llama-3.2-3B-Instruct
      --gpu-memory-utilization 0.45
      --enable-prefix-caching
      --max-model-len 4096
      --port 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - llm_net

  # vLLM Throughput: High-speed node with Multi-LoRA dynamic hot-swapping.
  vllm-throughput:
    image: vllm/vllm-openai:latest
    ports:
      - "8081:8080"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model meta-llama/Llama-3.2-3B-Instruct
      --quantization awq
      --gpu-memory-utilization 0.45
      --enable-prefix-caching
      --max-model-len 4096
      --enable-lora
      --max-loras 4
      --lora-modules reasoning-lora=PandurangMopgar/Llama-3.2-3B-Instruct-reasoning-lora reflection-lora=justmalhar/llama-3.2-3B-Instruct-Reflection-Beta-LoRA
      --port 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - llm_net

  # Ollama: Local CPU inference fallback (only started with --profile local).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local
    networks:
      - llm_net

  # --- Infrastructure ---

  # Redis: Used for caching and session state.
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - llm_net

  # Qdrant: Vector database for RAG retrieval.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles:
      - local
      - gpu
    networks:
      - llm_net

  # Prometheus: Metrics collection and monitoring.
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - local
      - gpu
    networks:
      - llm_net

  # Grafana: Visual observability dashboards & metrics analytics.
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles:
      - local
      - gpu
    networks:
      - llm_net

volumes:
  ollama_data:
  qdrant_data:

networks:
  llm_net:
