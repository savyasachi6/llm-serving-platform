# NVIDIA GPU Time-Slicing ConfigMap
# Enables fractional GPU sharing by advertising 4 virtual GPU replicas per physical GPU.
# This allows vllm-responder and vllm-agents to run concurrently on a single physical card.
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: kube-system
data:
  any: |-
    version: v1
    flags:
      migStrategy: "none"
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 4
