# ==============================================================================
# Kubernetes Playground UI Service Manifest
# ==============================================================================
# Exposes the frontend Nginx web server.
# In cloud environments (like GKE), type: LoadBalancer provisions a public cloud
# load balancer and external IP address.
# In local environments (like Minikube/Docker Desktop), you can access it via
# 'kubectl port-forward svc/playground 3000:80' or minikube service playground.
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: playground
  namespace: default
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: frontend-ui
    app.kubernetes.io/part-of: llm-serving-platform
    app: playground
spec:
  type: LoadBalancer
  selector:
    app: playground
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
