# ==============================================================================
# Kubernetes Playground UI Deployment Manifest
# ==============================================================================
# Runs the browser-based frontend UI for the LLM serving platform.
# Built as a multi-stage Docker image (Node.js compiler -> Alpine Nginx runtime).
# Serves static React/TypeScript assets and proxies API calls to agent-worker.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  namespace: default
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: frontend-ui
    app.kubernetes.io/part-of: llm-serving-platform
    app: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playground
        app.kubernetes.io/component: frontend-ui
        app.kubernetes.io/part-of: llm-serving-platform
        app: playground
    spec:
      containers:
        - name: playground
          image: playground:v1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
