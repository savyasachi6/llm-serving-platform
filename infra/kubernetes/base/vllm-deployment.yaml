# --- vLLM Deployment ---
# API version for Deployments.
apiVersion: apps/v1
# We use a Deployment to manage the vLLM (Vectorized Large Language Model) inference engine.
kind: Deployment
metadata:
  name: vllm
spec:
  # We only run 1 replica because vLLM usually consumes a lot of GPU memory and is stateful regarding its KV cache.
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          # We use the official vLLM Docker image configured for OpenAI-compatible API.
          image: vllm/vllm-openai:latest
          # Command overrides the default container entrypoint to start the vLLM server with specific flags.
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
            # Load the Llama-3.2-3B base model.
            - --model
            - meta-llama/Llama-3.2-3B-Instruct
            # Use AWQ quantization to reduce GPU memory footprint (4-bit).
            - --quantization
            - awq
            # Allocate 90% of the available GPU memory to vLLM (leaving 10% for overhead).
            - --gpu-memory-utilization
            - "0.90"
            # Enable prefix caching to speed up prompts that share a common prefix (e.g., system prompts).
            - --enable-prefix-caching
            # Set the maximum context window to 4096 tokens.
            - --max-model-len
            - "4096"
            # Enable LoRA (Low-Rank Adaptation) for dynamic model hot-swapping.
            - --enable-lora
            # Allow up to 4 different LoRA adapters to be loaded simultaneously in memory.
            - --max-loras
            - "4"
            # Pre-load specific LoRA modules at startup. We map 'reasoning-lora' and 'reflection-lora' to their HuggingFace paths.
            - --lora-modules
            - reasoning-lora=PandurangMopgar/Llama-3.2-3B-Instruct-reasoning-lora
            - reflection-lora=justmalhar/llama-3.2-3B-Instruct-Reflection-Beta-LoRA
            # Listen on port 8080.
            - --port
            - "8080"
          ports:
            - containerPort: 8080
          env:
            # We securely pull the HuggingFace token from a Kubernetes Secret to download gated models.
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  # If the secret doesn't exist, it won't crash the pod (optional: true).
                  optional: true
          resources:
            # We explicitly request and limit the pod to exactly 1 NVIDIA GPU.
            # This requires the NVIDIA device plugin to be installed on the K8s cluster.
            limits:
              nvidia.com/gpu: 1
---
# --- vLLM Service ---
# API version for Services.
apiVersion: v1
# Expose the vLLM engine to other pods in the cluster.
kind: Service
metadata:
  # The DNS name 'vllm' allows the gateway to easily route traffic to this service.
  name: vllm
spec:
  selector:
    app: vllm
  ports:
    - protocol: TCP
      # Expose port 8080 internally.
      port: 8080
      targetPort: 8080
