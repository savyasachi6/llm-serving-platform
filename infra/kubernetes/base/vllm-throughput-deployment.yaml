apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-throughput
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-throughput
  template:
    metadata:
      labels:
        app: vllm-throughput
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
            - --model
            - meta-llama/Llama-3.2-3B-Instruct
            - --quantization
            - awq
            - --gpu-memory-utilization
            - "0.45"
            - --enable-prefix-caching
            - --max-model-len
            - "4096"
            - --enable-lora
            - --lora-modules
            - reasoning-lora=PandurangMopgar/Llama-3.2-3B-Instruct-reasoning-lora
            - reflection-lora=justmalhar/llama-3.2-3B-Instruct-Reflection-Beta-LoRA
            - --port
            - "8080"
          ports:
            - containerPort: 8080
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-throughput
spec:
  selector:
    app: vllm-throughput
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
