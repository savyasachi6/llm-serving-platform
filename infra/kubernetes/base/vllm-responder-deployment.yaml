# ==============================================================================
# Kubernetes vLLM Responder Deployment & Service Manifest
# ==============================================================================
# Dedicated high-accuracy inference engine for reasoning and response synthesis.
# Serves Qwen/Qwen2.5-1.5B-Instruct without dynamic adapters.
#
# Memory Strategy:
#   Using kvcached for dynamic memory pooling. The virtual ceiling is set to 0.90,
#   but physical memory is allocated elastically via the /tmp/kvcached-ipc socket.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-responder
  namespace: default
  labels:
    app.kubernetes.io/name: vllm-responder
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: llm-serving-platform
    app: vllm-responder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-responder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-responder
        app.kubernetes.io/component: inference-engine
        app.kubernetes.io/part-of: llm-serving-platform
        app: vllm-responder
    spec:
      containers:
        - name: vllm-responder
          image: ghcr.io/ovg-project/kvcached-vllm:v0.24.0
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
            - Qwen/Qwen2.5-1.5B-Instruct
            # Virtual VRAM ceiling: kvcached manages physical allocation dynamically
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "2048"
            - --enforce-eager
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Route KV cache requests dynamically through the IPC socket to kvcached:
            - name: ENABLE_KVCACHED
              value: "true"
            - name: KVCACHED_AUTOPATCH
              value: "1"
            - name: KVCACHED_IPC_PATH
              value: "/tmp/kvcached-ipc/kvcached.sock"
            # WSL2 / Container Toolkit host pin memory optimization
            - name: VLLM_WSL2_ENABLE_PIN_MEMORY
              value: "1"
            # Optional Hugging Face Hub token referenced from Kubernetes Secret
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            # Mount the shared IPC socket directory from the kvcached daemonset
            - name: kvcached-ipc
              mountPath: /tmp/kvcached-ipc
      volumes:
        - name: kvcached-ipc
          hostPath:
            path: /tmp/kvcached-ipc
            type: DirectoryOrCreate
---
# ==============================================================================
# vLLM Responder Internal Service
# ==============================================================================
# Exposes the OpenAI-compatible vLLM API to the Gateway at http://vllm-responder:8080
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: vllm-responder
  namespace: default
  labels:
    app.kubernetes.io/name: vllm-responder
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: llm-serving-platform
    app: vllm-responder
spec:
  type: ClusterIP
  selector:
    app: vllm-responder
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
