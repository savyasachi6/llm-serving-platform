# ==============================================================================
# Kubernetes Agent Worker Deployment Manifest
# ==============================================================================
# The Agent Worker orchestrates the multi-agent assembly line.
# It splits tickets into concurrent micro-agent tasks (Triage and PII Redaction),
# enforces security barriers, and invokes the response synthesis agent via the Gateway.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: default
  labels:
    app.kubernetes.io/name: agent-worker
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: llm-serving-platform
    app: agent-worker
spec:
  # 3 replicas enable parallel execution of ticket processing workflows across cluster nodes
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: llm-serving-platform
        app: agent-worker
    spec:
      containers:
        - name: agent-worker
          image: agent-worker:v1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            # Connect to the gateway service via internal Kubernetes DNS name and port
            - name: GATEWAY_URL
              value: "http://gateway:80"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
