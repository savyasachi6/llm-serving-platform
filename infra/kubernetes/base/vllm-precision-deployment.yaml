apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-precision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-precision
  template:
    metadata:
      labels:
        app: vllm-precision
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
            - --model
            - google/gemma-2-2b-it
            - --quantization
            - bitsandbytes
            - --load-format
            - bitsandbytes
            - --gpu-memory-utilization
            - "0.45"
            - --enable-prefix-caching
            - --max-model-len
            - "4096"
            - --port
            - "8080"
          ports:
            - containerPort: 8080
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-precision
spec:
  selector:
    app: vllm-precision
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
