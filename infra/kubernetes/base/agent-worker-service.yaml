# ==============================================================================
# Kubernetes Agent Worker Service Manifest
# ==============================================================================
# Exposes the Agent Worker FastAPI application internally to other cluster pods
# (such as an Ingress or the Playground UI).
# Available at DNS endpoint: http://agent-worker:8001
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: agent-worker
  namespace: default
  labels:
    app.kubernetes.io/name: agent-worker
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: llm-serving-platform
    app: agent-worker
spec:
  type: ClusterIP
  selector:
    app: agent-worker
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
