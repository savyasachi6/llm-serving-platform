# ==============================================================================
# Kubernetes API Gateway Service Manifest
# ==============================================================================
# Provides a stable internal virtual IP (ClusterIP) and DNS name for the Gateway pods.
# Other cluster services (such as agent-worker) communicate with the gateway via
# http://gateway:80 or http://gateway.default.svc.cluster.local:80.
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: default
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: ingress-control
    app.kubernetes.io/part-of: llm-serving-platform
    app: gateway
spec:
  # ClusterIP is the default service type: assigns an internal IP reachable only inside the cluster
  type: ClusterIP
  # Pod selector: Matches pods with label 'app: gateway'. Kubernetes creates Endpoints
  # for all healthy pods passing their readinessProbe.
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      # The port exposed by the Service internally (clients connect to port 80)
      port: 80
      # The target port on the container where the application listens (8000)
      # Kubernetes iptables / IPVS translates port 80 -> containerPort 8000
      targetPort: 8000
