# ==============================================================================
# Kubernetes API Gateway Deployment Manifest
# ==============================================================================
# The Gateway is the central ingress control point for the serving platform.
# It performs token bucket and semaphore admission control, tenant-isolated exact
# match caching, and dynamic routing across heterogeneous model backends.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: default
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: ingress-control
    app.kubernetes.io/part-of: llm-serving-platform
    app: gateway
spec:
  # Maintain 3 identical replicas for high availability and zero-downtime rolling updates
  replicas: 3
  # RollingUpdate strategy ensures at least 2 pods remain available during deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod during rollout (total 4)
      maxUnavailable: 0  # Ensure all 3 existing pods stay live until new pod is ready
  # Pod selector: Links this Deployment controller to its managed Pod replicas
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: ingress-control
        app.kubernetes.io/part-of: llm-serving-platform
        app: gateway
    spec:
      containers:
        - name: gateway
          # Image built from apps/gateway/Dockerfile
          image: gateway:v1.2
          # IfNotPresent uses local cache if present, preventing unnecessary registry pulls
          imagePullPolicy: IfNotPresent
          ports:
            # Internal port where FastAPI / Uvicorn listens
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: "8000"
            - name: GATEWAY_LOG_LEVEL
              value: "INFO"
            # Route to inference backends using Kubernetes CoreDNS service names:
            - name: VLLM_RESPONDER_BASE_URL
              value: "http://vllm-responder:8080/v1"
            - name: VLLM_AGENTS_BASE_URL
              value: "http://vllm-agents:8080/v1"
            - name: VLLM_BASE_URL
              value: "http://vllm-responder:8080/v1"
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: USE_MOCK
              value: "False"
          # Resource requests are REQUIRED for the HorizontalPodAutoscaler (HPA) to calculate
          # CPU utilization percentages. Without requests, HPA reports <unknown>/75% and fails to scale.
          resources:
            requests:
              cpu: "200m"      # 0.2 CPU cores baseline
              memory: "512Mi"  # 512 Megabytes RAM baseline
            limits:
              cpu: "1000m"     # Maximum 1 CPU core burst
              memory: "1Gi"    # Maximum 1 Gigabyte RAM before OOMKill
          # Liveness Probe: Verifies process is alive. Kills and restarts container if failing.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness Probe: Verifies container is ready to accept user traffic.
          # If failing, Kubernetes temporarily removes pod IP from Gateway Service endpoints.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Security Context: Hardens container execution
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
