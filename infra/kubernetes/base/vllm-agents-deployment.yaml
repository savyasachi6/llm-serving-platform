# ==============================================================================
# Kubernetes vLLM Agents Deployment & Service Manifest
# ==============================================================================
# High-speed inference engine equipped with Multi-LoRA dynamic adapter hot-swapping.
# Serves the Qwen/Qwen2.5-0.5B-Instruct base model and registers multiple low-rank
# adapters in memory simultaneously.
#
# Workload Mapping:
#   - Triage Agent requests model="reasoning-lora" for fast intent classification
#   - Redact Agent requests model="reflection-lora" for PII redaction
#
# Memory Strategy:
#   Using kvcached for dynamic memory pooling. The virtual ceiling is set to 0.90,
#   but physical memory is allocated elastically via the /tmp/kvcached-ipc socket.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-agents
  namespace: default
  labels:
    app.kubernetes.io/name: vllm-agents
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: llm-serving-platform
    app: vllm-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-agents
        app.kubernetes.io/component: inference-engine
        app.kubernetes.io/part-of: llm-serving-platform
        app: vllm-agents
    spec:
      containers:
        - name: vllm-agents
          image: ghcr.io/ovg-project/kvcached-vllm:v0.24.0
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
            - Qwen/Qwen2.5-0.5B-Instruct
            # Virtual VRAM ceiling: kvcached manages physical allocation dynamically
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "1024"
            - --enforce-eager
            - --enable-lora
            - --max-loras
            - "4"
            - --lora-modules
            - reasoning-lora=wuyanzu4692/task-13-Qwen-Qwen2.5-0.5B-Instruct
            - reflection-lora=Hebisuke/Qwen2.5-0.5B-Instruct_bias2_0.5B
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Route KV cache requests dynamically through the IPC socket to kvcached:
            - name: ENABLE_KVCACHED
              value: "true"
            - name: KVCACHED_AUTOPATCH
              value: "1"
            - name: KVCACHED_IPC_PATH
              value: "/tmp/kvcached-ipc/kvcached.sock"
            - name: VLLM_WSL2_ENABLE_PIN_MEMORY
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            # Mount the shared IPC socket directory from the kvcached daemonset
            - name: kvcached-ipc
              mountPath: /tmp/kvcached-ipc
      volumes:
        - name: kvcached-ipc
          hostPath:
            path: /tmp/kvcached-ipc
            type: DirectoryOrCreate
---
# ==============================================================================
# vLLM Agents Internal Service
# ==============================================================================
# Exposes the Multi-LoRA vLLM API to the Gateway at http://vllm-agents:8080
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: vllm-agents
  namespace: default
  labels:
    app.kubernetes.io/name: vllm-agents
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: llm-serving-platform
    app: vllm-agents
spec:
  type: ClusterIP
  selector:
    app: vllm-agents
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
