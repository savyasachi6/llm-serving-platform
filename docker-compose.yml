# ==============================================================================
# Agentic LLM Serving Platform - Root Docker Compose Configuration
# ==============================================================================
# This configuration focuses on running the high-performance Qwen model family
# with the kvcached dynamic VRAM manager daemon on a local GPU workstation.
#
# Highlights:
#   - vLLM Responder: Qwen/Qwen2.5-1.5B-Instruct (High-accuracy reasoning)
#   - vLLM Agents:    Qwen/Qwen2.5-0.5B-Instruct (Multi-LoRA hot-swapping)
#   - kvcached:       Dynamically arbitrates GPU VRAM over Unix domain IPC socket
#   - Gateway:        FastAPI ingress with admission control and tenant caching
#   - Agent Worker:   Asynchronous multi-agent assembly line orchestrator
#   - Redis:          Exact-match tenant cache store
#
# Comparison with infra/compose/docker-compose.yml:
#   - This root file provides an out-of-the-box, standalone GPU stack using Qwen models.
#   - infra/compose/docker-compose.yml is the multi-profile stack supporting --profile local
#     (Ollama CPU fallback) and --profile gpu (Llama-3.2 + Qdrant + Observability stack).
#
# Quick Commands:
#   Start Stack:    docker compose up -d --build
#   Check Status:   docker compose ps
#   View Logs:      docker compose logs -f gateway
#   Stop Stack:     docker compose down
#   Clean Volumes:  docker compose down -v
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Application Services
  # ----------------------------------------------------------------------------

  # API Gateway: Ingress control, admission shedding, tenant-safe caching.
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    image: gateway:v1.2
    container_name: llm-gateway-root
    restart: unless-stopped
    ports:
      # HOST_PORT:CONTAINER_PORT
      # Access Swagger UI documentation at http://localhost:8000/docs
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - USE_MOCK=${USE_MOCK:-True}
      # Internal DNS names automatically resolved by Docker's embedded DNS:
      - VLLM_RESPONDER_BASE_URL=http://vllm-responder:8080/v1
      - VLLM_AGENTS_BASE_URL=http://vllm-agents:8080/v1
      - VLLM_BASE_URL=http://vllm-responder:8080/v1
      - OLLAMA_BASE_URL=http://ollama:11434
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - llm-network

  # Agent Worker: Multi-agent pipeline coordinating Triage, Redaction, and Response.
  agent-worker:
    build:
      context: .
      dockerfile: apps/agent-worker/Dockerfile
    image: agent-worker:v1.2
    container_name: llm-agent-worker-root
    restart: unless-stopped
    ports:
      # HOST_PORT:CONTAINER_PORT
      # Multi-agent ticket processing API on port 8001
      - "8001:8001"
    environment:
      - GATEWAY_URL=http://gateway:8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - llm-network

  # Playground: Interactive React/TypeScript frontend UI.
  playground:
    build:
      context: apps/playground
      dockerfile: Dockerfile
    image: playground:v1.1
    container_name: llm-playground-root
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8001
    depends_on:
      - agent-worker
    networks:
      - llm-network

  # Ollama: Local inference fallback for CPU or single GPU environments.
  ollama:
    image: ollama/ollama:latest
    container_name: llm-ollama-root
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - llm-network

  # ----------------------------------------------------------------------------
  # Dynamic VRAM Management (kvcached)
  # ----------------------------------------------------------------------------

  # ----------------------------------------------------------------------------
  # Inference Engines (vLLM Dual-Engine Stack)
  # ----------------------------------------------------------------------------

  # vllm-responder:
  # Dedicated high-accuracy inference engine for reasoning and final response synthesis.
  # Serves Qwen2.5-1.5B-Instruct without LoRAs.
  # Note: kvcached is built directly into ghcr.io/ovg-project/kvcached-vllm:latest.
  vllm-responder:
    image: ghcr.io/ovg-project/kvcached-vllm:latest # Patched kvcached vLLM image
    container_name: llm-vllm-responder-root
    restart: unless-stopped
    command:
      - --model
      - Qwen/Qwen2.5-1.5B-Instruct
      # 0.90 is a virtual address ceiling; kvcached manages physical allocation
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "2048"
      - --enforce-eager
      - --port
      - "8080"
    ports:
      # HOST_PORT:CONTAINER_PORT - mapped to host 8082 to avoid collisions
      - "8082:8080"
    # Why 'required: false'? In Docker Compose v2.24+, setting 'required: false'
    # ensures 'docker compose config' and 'docker compose up' do NOT crash when
    # .env has not yet been created (e.g. in fresh Git clones or CI/CD pipelines).
    env_file:
      - path: .env
        required: false
    environment:
      # Why VLLM_WSL2_ENABLE_PIN_MEMORY=1? WSL2 GPU passthrough does not support
      # CUDA pinned memory without special flags. Enabling this prevents CUDA allocator
      # runtime errors when running on Windows WSL2.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      # Configure dynamic memory paging through kvcached:
      - ENABLE_KVCACHED=true
      - KVCACHED_AUTOPATCH=1
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - llm-network

  # vllm-agents:
  # High-throughput inference engine for micro-agent tasks (Triage and PII Redact).
  # Dynamically hot-swaps between reasoning-lora (intent classification) and
  # reflection-lora (PII removal) on demand.
  vllm-agents:
    image: ghcr.io/ovg-project/kvcached-vllm:latest # Patched kvcached vLLM image
    container_name: llm-vllm-agents-root
    restart: unless-stopped
    command:
      - --model
      - Qwen/Qwen2.5-0.5B-Instruct
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "1024"
      - --enforce-eager
      - --enable-lora
      - --max-loras
      - "4"
      - --lora-modules
      - reasoning-lora=wuyanzu4692/task-13-Qwen-Qwen2.5-0.5B-Instruct
      - reflection-lora=Hebisuke/Qwen2.5-0.5B-Instruct_bias2_0.5B
      - --port
      - "8080"
    ports:
      # HOST_PORT:CONTAINER_PORT - mapped to host 8083 to avoid collisions
      - "8083:8080"
    # Why 'required: false'? In Docker Compose v2.24+, setting 'required: false'
    # ensures 'docker compose config' and 'docker compose up' do NOT crash when
    # .env has not yet been created (e.g. in fresh Git clones or CI/CD pipelines).
    env_file:
      - path: .env
        required: false
    environment:
      # Why VLLM_WSL2_ENABLE_PIN_MEMORY=1? Enables memory pinning compatibility
      # across Windows WSL2 GPU virtualized environments.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      # Route KV cache requests dynamically through kvcached:
      - ENABLE_KVCACHED=true
      - KVCACHED_AUTOPATCH=1
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - llm-network

  # ----------------------------------------------------------------------------
  # In-Memory Cache
  # ----------------------------------------------------------------------------

  # Redis: Key-value cache store for tenant-isolated exact-match caching.
  redis:
    image: redis:alpine
    container_name: llm-redis-root
    restart: unless-stopped
    ports:
      # HOST_PORT:CONTAINER_PORT
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - llm-network

# ------------------------------------------------------------------------------
# Network Isolation & Volumes
# ------------------------------------------------------------------------------
networks:
  # Internal bridge network connecting the Qwen serving stack
  llm-network:
    name: llm_serving_root_network
    driver: bridge

volumes:
  ollama_data:
  vllm_cache:

