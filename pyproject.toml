# [project] Table (PEP 621 Standard)
# Root workspace project metadata and global dependencies shared across all microservices.
[project]
name = "agentic-llm-serving-platform"
version = "0.1.0"
description = "Cost-efficient, high-throughput, cache-aware LLM inference platform for multi-agent workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.3",
]

# [tool.uv.workspace] Table (UV Monorepo Workspace Configuration)
# Tells 'uv' to manage apps and packages as linked workspace members in a single shared virtual environment.
[tool.uv.workspace]
# Includes all microservices under 'apps/' and shared internal libraries under 'packages/'
members = ["apps/*", "packages/*"]
# Excludes Node.js / React frontend from Python workspace resolution
exclude = ["apps/playground"]

# [tool.pytest.ini_options] Table (Pytest Test Runner Configuration)
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --asyncio-mode=auto --import-mode=importlib"
# Adds application and package source directories to pytest sys.path during test execution
pythonpath = [
    "apps/gateway",
    "apps/agent-worker",
    "packages/contracts/src",
    "packages/prompt-engine/src",
    "packages/retrieval/src",
    "packages/evaluation/src",
    "packages/common/src"
]
testpaths = [
    "tests",
    "apps/gateway/tests",
    "apps/agent-worker/tests",
    "packages/contracts/tests",
    "packages/prompt-engine/tests",
    "packages/retrieval/tests",
    "packages/evaluation/tests",
    "packages/common/tests"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
